<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Scan Barcode - Toko Barokah</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      min-height: 100vh;

      background: #f5f6f8;

      font-family: Arial, sans-serif;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 20px;

    }

    .container {

      width: 100%;

      max-width: 450px;

      background: white;

      border-radius: 22px;

      padding: 24px;

      box-shadow:
        0 10px 35px rgba(0,0,0,.10);

    }

    .title {

      text-align: center;

      font-size: 25px;

      font-weight: 700;

      margin-bottom: 6px;

    }

    .subtitle {

      text-align: center;

      color: #777;

      font-size: 14px;

      margin-bottom: 22px;

    }

    #reader {

      width: 100%;

      overflow: hidden;

      border-radius: 15px;

    }

    .result {

      margin-top: 18px;

      padding: 18px;

      border-radius: 14px;

      background: #f1f1f1;

      text-align: center;

      display: none;

    }

    .result-label {

      font-size: 14px;

      color: #777;

      margin-bottom: 6px;

    }

    .result-code {

      font-size: 27px;

      font-weight: 700;

      word-break: break-all;

    }

    .message {

      text-align: center;

      color: #777;

      font-size: 13px;

      margin-top: 15px;

      line-height: 1.5;

    }

    .close-button {

      width: 100%;

      height: 50px;

      border: none;

      border-radius: 12px;

      background: #222;

      color: white;

      font-size: 14px;

      font-weight: 700;

      margin-top: 18px;

      cursor: pointer;

    }

  </style>

</head>


<body>


  <div class="container">

    <div class="title">
      📷 Scan Barcode
    </div>

    <div class="subtitle">
      Toko Barokah Arjosari
    </div>


    <div id="reader"></div>


    <div
      id="result"
      class="result">

      <div class="result-label">
        Barcode terbaca
      </div>

      <div
        id="resultCode"
        class="result-code">
      </div>

    </div>


    <div
      id="message"
      class="message">

      Arahkan kamera ke barcode barang.

    </div>


    <button
      class="close-button"
      onclick="tutupScanner()">

      ✕ Tutup Scanner

    </button>

  </div>


<script>


// =====================================================
// VARIABEL
// =====================================================

let scanner = null;

let sudahScan = false;


// =====================================================
// AMBIL ALAMAT KEMBALI
// =====================================================

const params =
  new URLSearchParams(
    window.location.search
  );

const returnUrl =
  params.get('return');


// =====================================================
// MULAI SCANNER
// =====================================================

function mulaiScanner() {

  scanner =
    new Html5Qrcode('reader');


  const config = {

    fps: 10,

    qrbox: {

      width: 280,

      height: 140

    },

    aspectRatio: 1.777778

  };


  scanner.start(

    {
      facingMode: 'environment'
    },

    config,

    function(decodedText) {

      if (sudahScan) {
        return;
      }

      sudahScan = true;


      // Tampilkan hasil

      document.getElementById(
        'resultCode'
      ).textContent = decodedText;


      document.getElementById(
        'result'
      ).style.display = 'block';


      document.getElementById(
        'message'
      ).textContent =
        'Barcode berhasil dibaca.';


      // =================================================
      // KEMBALI KE APLIKASI TOKO
      // =================================================

      if (returnUrl) {

        scanner.stop()
          .then(function() {

            scanner.clear();

            // Gabungkan barcode
            // ke alamat kembali

            const separator =
              returnUrl.includes('?')
                ? '&'
                : '?';

            const tujuan =
              returnUrl +
              separator +
              'barcode=' +
              encodeURIComponent(
                decodedText
              );

            window.location.href =
              tujuan;

          })

          .catch(function() {

            const separator =
              returnUrl.includes('?')
                ? '&'
                : '?';

            const tujuan =
              returnUrl +
              separator +
              'barcode=' +
              encodeURIComponent(
                decodedText
              );

            window.location.href =
              tujuan;

          });

      }

    },

    function(errorMessage) {

      // Tidak melakukan apa-apa
      // selama barcode belum terbaca

    }

  )

  .catch(function(error) {

    console.error(error);

    document.getElementById(
      'message'
    ).textContent =
      'Kamera tidak dapat digunakan. ' +
      'Pastikan izin kamera diberikan.';

  });

}


// =====================================================
// TUTUP SCANNER
// =====================================================

function tutupScanner() {

  if (scanner) {

    scanner.stop()

      .then(function() {

        scanner.clear();

        scanner = null;

        window.close();

      })

      .catch(function() {

        window.close();

      });

  } else {

    window.close();

  }

}


// =====================================================
// JALANKAN
// =====================================================

window.addEventListener(
  'load',
  function() {

    mulaiScanner();

  }
);


</script>

</body>

</html>
